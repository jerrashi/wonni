<!doctype html>
<html>
<head><title>Connecting TikTok Shop…</title></head>
<body>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-functions.js";

  const firebaseConfig = {
    apiKey: "AIzaSyB7QQahI-DxHsDE7OKaxtXfdQucr1sSxfU",
    authDomain: "wonni-dropship.firebaseapp.com",
    projectId: "wonni-dropship",
    storageBucket: "wonni-dropship.firebasestorage.app",
    messagingSenderId: "431608790074",
    appId: "1:431608790074:web:3672d25c487400ba034903",
  };
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const functions = getFunctions(app);

  const params = new URLSearchParams(window.location.search);
  const code = params.get("code") ?? params.get("auth_code");

  if (!code) {
    document.body.innerText = "No code received. Close this window and try again.";
  } else {
    auth.authStateReady().then(async () => {
      if (!auth.currentUser) {
        document.body.innerText = "Not signed in. Please sign in from the dashboard first.";
        return;
      }
      document.body.innerText = "Connecting TikTok Shop…";
      try {
        await httpsCallable(functions, "tiktokExchangeToken")({
          code,
          redirectUri: window.location.origin + window.location.pathname,
        });
        document.body.innerText = "TikTok Shop connected! You can close this window.";
        setTimeout(() => window.close(), 1500);
      } catch (e) {
        document.body.innerText = "Error: " + e.message;
      }
    });
  }
</script>
</body>
</html>
