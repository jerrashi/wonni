<!doctype html>
<html>
<head><title>Connecting eBay…</title></head>
<body>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-functions.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCrroW6RXSl15a4j9FPeAUOqkiNCx3g2Lk",
    authDomain: "wonni-app.firebaseapp.com",
    projectId: "wonni-app",
    storageBucket: "wonni-app.firebasestorage.app",
    messagingSenderId: "840012373819",
    appId: "1:840012373819:web:c5081552e35940d578a11e",
  };
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const functions = getFunctions(app);

  const params = new URLSearchParams(window.location.search);
  const code = params.get("code");
  const state = params.get("state");

  if (!code) {
    document.body.innerText = "No code received. Close this window and try again.";
  } else {
    document.body.innerText = "Connecting eBay…";

    // Use onAuthStateChanged to handle auth state across window contexts
    const unsubscribe = onAuthStateChanged(auth, async (user) => {
      unsubscribe();

      if (!user) {
        // Request auth from parent window via postMessage
        window.opener?.postMessage({ type: "EBAY_AUTH_REQUEST" }, "*");
        document.body.innerText = "Waiting for authentication…";
        return;
      }

      try {
        await httpsCallable(functions, "ebayExchangeToken")({ code, state, credentialSet: "web" });

        // Notify parent window of success
        window.opener?.postMessage({ type: "EBAY_AUTH_SUCCESS" }, "*");
        document.body.innerText = "eBay connected! You can close this window.";
        setTimeout(() => window.close(), 1500);
      } catch (e) {
        // Notify parent window of error
        window.opener?.postMessage({ type: "EBAY_AUTH_ERROR", error: e.message }, "*");
        document.body.innerText = "Error: " + e.message;
      }
    });
  }
</script>
</body>
</html>
