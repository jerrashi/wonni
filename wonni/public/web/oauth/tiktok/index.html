<!doctype html>
<html>
<head><title>Connecting TikTok Shop…</title></head>
<body>
<script type="module">
  const params = new URLSearchParams(window.location.search);
  const code = params.get("code") ?? params.get("auth_code");
  const state = params.get("state");
  const error = params.get("error");

  document.body.innerText = "Connecting…";

  if (error) {
    if (window.opener) {
      window.opener.postMessage({ type: "TIKTOK_AUTH_CALLBACK", error }, "*");
    }
    document.body.innerText = `Error: ${error}. Close this window.`;
  } else if (!code) {
    if (window.opener) {
      window.opener.postMessage({ type: "TIKTOK_AUTH_CALLBACK", error: "No code received" }, "*");
    }
    document.body.innerText = "No code received. Close this window and try again.";
  } else {
    if (window.opener) {
      window.opener.postMessage({ type: "TIKTOK_AUTH_CALLBACK", code, state }, "*");
    }
    document.body.innerText = "TikTok Shop connected! You can close this window.";
    setTimeout(() => window.close(), 1500);
  }
</script>
</body>
</html>
