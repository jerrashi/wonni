<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connecting Etsy…</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background: #f5f5f7;
      color: #1d1d1f;
      text-align: center;
    }
    .card {
      background: #fff;
      padding: 32px 40px;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
      max-width: 360px;
    }
    p { font-size: 16px; margin: 0; }
    .status { font-weight: 600; margin-bottom: 8px; }
  </style>
</head>
<body>
  <div class="card">
    <p id="status-text" class="status">Connecting Etsy…</p>
    <p id="sub-text" style="font-size: 13px; color: #86868b;">Please wait while we complete the connection.</p>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-functions.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCrroW6RXSl15a4j9FPeAUOqkiNCx3g2Lk",
      authDomain: "wonni-app.firebaseapp.com",
      projectId: "wonni-app",
      storageBucket: "wonni-app.firebasestorage.app",
      messagingSenderId: "840012373819",
      appId: "1:840012373819:web:c5081552e35940d578a11e",
    };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const functions = getFunctions(app);

    const params = new URLSearchParams(window.location.search);
    const code = params.get("code");
    const state = params.get("state");
    const error = params.get("error");
    const statusText = document.getElementById("status-text");
    const subText = document.getElementById("sub-text");

    const codeVerifier = (state && (localStorage.getItem(`etsy_verifier_${state}`) || sessionStorage.getItem(`etsy_verifier_${state}`)))
      || localStorage.getItem("latest_etsy_verifier")
      || sessionStorage.getItem("latest_etsy_verifier");

    if (error) {
      statusText.innerText = "Connection Failed";
      subText.innerText = error;
      if (!codeVerifier) {
        window.location.href = 'wonni://oauth/etsy?error=' + encodeURIComponent(error);
      }
    } else if (!code) {
      statusText.innerText = "No code received";
      subText.innerText = "Please close this window and try connecting again.";
    } else if (codeVerifier) {
      // Web Flow: Exchange token via Cloud Function
      function handleExchange(user) {
        if (!user) {
          statusText.innerText = "Not signed in";
          subText.innerText = "Please sign in to Wonni in your main window first, then try again.";
          return;
        }
        statusText.innerText = "Exchanging Etsy Token…";
        subText.innerText = "Linking your Etsy shop to your account…";

        httpsCallable(functions, "etsyExchangeToken")({
          code,
          codeVerifier,
          redirectUri: "https://wonni-app.web.app/oauth/etsy",
          credentialSet: "web",
        }).then((res) => {
          if (state) {
            localStorage.removeItem(`etsy_verifier_${state}`);
            sessionStorage.removeItem(`etsy_verifier_${state}`);
          }
          localStorage.removeItem("latest_etsy_verifier");
          sessionStorage.removeItem("latest_etsy_verifier");
          statusText.innerText = "✓ Etsy Connected!";
          subText.innerText = res.data?.shopName ? `Connected as ${res.data.shopName}. Closing window…` : "You can close this window.";
          setTimeout(() => window.close(), 1800);
        }).catch((e) => {
          console.error("Etsy exchange error:", e);
          statusText.innerText = "Error Connecting Etsy";
          subText.innerText = e.message || "Failed to exchange token.";
        });
      }

      if (auth.currentUser) {
        handleExchange(auth.currentUser);
      } else {
        const unsub = onAuthStateChanged(auth, (user) => {
          unsub();
          handleExchange(user);
        });
      }
    } else {
      // iOS Flow: forward to custom URL scheme
      var redirect = 'wonni://oauth/etsy?code=' + encodeURIComponent(code);
      if (state) redirect += '&state=' + encodeURIComponent(state);
      window.location.href = redirect;
    }
  </script>
</body>
</html>
