name: TestFlight

on:
  push:
    branches: [main]
    paths: [wonni/**]
  # Manual re-run (Actions → TestFlight → Run workflow), e.g. after fixing signing.
  workflow_dispatch:

concurrency:
  group: testflight-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Least privilege: the default GITHUB_TOKEN can only read repo contents.
permissions:
  contents: read

jobs:
  archive-and-upload:
    name: Archive & Upload to TestFlight
    runs-on: macos-latest
    timeout-minutes: 30
    # Requires three repo secrets from an App Store Connect API key
    # (App Store Connect → Users and Access → Integrations → Keys; the key
    # needs at least "App Manager" role so automatic signing can manage
    # certs/profiles on the runner):
    #   APP_STORE_CONNECT_KEY_ID       — the key's Key ID
    #   APP_STORE_CONNECT_ISSUER_ID    — the Issuer ID shown on the same page
    #   APP_STORE_CONNECT_API_KEY_P8   — the *.p8 file's contents, base64-encoded
    #                                    (e.g. `base64 -i AuthKey_XXXX.p8 | pbcopy`)
    # This job intentionally does nothing (fails fast with a clear message)
    # until those are set — see the "Check required secrets" step below.
    #
    # Persistent signing certificates (added 2026-10-01). Every runner starts
    # with an empty keychain, so automatic signing minted a NEW certificate on
    # every run — until Apple's per-account cap was hit and the archive failed
    # with "Choose a certificate to revoke. Your account has reached the maximum
    # number of certificates" (run 36910045462). Each of those certs' private
    # keys died with its runner, so they're dead weight: revoke them at
    # developer.apple.com → Certificates. To stop it recurring, export ONE of
    # each from Keychain Access (right-click → Export → .p12, set a password)
    # and add:
    #   SIGNING_CERT_DEVELOPMENT_P12    — "Apple Development" .p12, base64
    #   SIGNING_CERT_DISTRIBUTION_P12   — "Apple Distribution" .p12, base64
    #                                     (Xcode → Settings → Accounts → Manage
    #                                     Certificates → + → Apple Distribution
    #                                     if you don't have one yet)
    #   SIGNING_CERT_PASSWORD           — the password used for both exports
    # With these present, automatic signing reuses them (the API key is still
    # needed to fetch/create provisioning profiles, which have no such cap).
    # Without them the job behaves as before and warns.
    steps:
      - uses: actions/checkout@v4

      - name: Import signing certificates
        env:
          SIGNING_CERT_DEVELOPMENT_P12: ${{ secrets.SIGNING_CERT_DEVELOPMENT_P12 }}
          SIGNING_CERT_DISTRIBUTION_P12: ${{ secrets.SIGNING_CERT_DISTRIBUTION_P12 }}
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          if [ -z "$SIGNING_CERT_DEVELOPMENT_P12$SIGNING_CERT_DISTRIBUTION_P12" ]; then
            echo "::warning::No SIGNING_CERT_*_P12 secrets set — automatic signing will mint a new certificate on this runner (see the comment at the top of this workflow)."
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          imported=0
          for var in SIGNING_CERT_DEVELOPMENT_P12 SIGNING_CERT_DISTRIBUTION_P12; do
            [ -z "${!var}" ] && continue
            P12="$RUNNER_TEMP/$var.p12"
            echo "${!var}" | base64 --decode > "$P12"
            security import "$P12" -P "$SIGNING_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
            rm -f "$P12"
            imported=$((imported + 1))
          done
          # Let codesign use the keys without a UI prompt, and make this keychain searchable.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          echo "Imported $imported certificate(s):"
          security find-identity -v -p codesigning "$KEYCHAIN" | sed -E 's/[0-9A-F]{40}/<sha1>/'

      - name: Check required secrets
        run: |
          missing=()
          [ -z "${{ secrets.APP_STORE_CONNECT_KEY_ID }}" ] && missing+=("APP_STORE_CONNECT_KEY_ID")
          [ -z "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}" ] && missing+=("APP_STORE_CONNECT_ISSUER_ID")
          [ -z "${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}" ] && missing+=("APP_STORE_CONNECT_API_KEY_P8")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required repo secret(s): ${missing[*]}"
            echo "Add these under Settings → Secrets and variables → Actions."
            echo "See the comment block at the top of this workflow file for how to get them."
            exit 1
          fi

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Provide Secrets.xcconfig
        # Same placeholder used by the existing test workflow (test.yml) —
        # a real production Secrets.xcconfig is never committed. If the app
        # needs real (non-placeholder) API keys baked into a TestFlight
        # build, that's a separate decision (e.g. a dedicated encrypted
        # Secrets.xcconfig secret) not made here.
        run: cp wonni/wonni/Secrets.xcconfig.example wonni/wonni/Secrets.xcconfig

      - name: Install App Store Connect API key
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APP_STORE_CONNECT_API_KEY_P8" | base64 --decode \
            > ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8

      - name: Bump build number
        # Uses the GitHub Actions run number as the build number — simple,
        # monotonically increasing across runs on this workflow, and needs
        # no commit back to the repo (the bump only exists in this ephemeral
        # checkout, matching how `wonni/scripts/testflight.sh`'s local
        # `agvtool new-version` bump is also never committed).
        run: |
          cd wonni
          agvtool new-version -all "$GITHUB_RUN_NUMBER"

      - name: Archive
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          cd wonni
          mkdir -p build
          xcodebuild archive \
            -project wonni.xcodeproj \
            -scheme wonni \
            -configuration Release \
            -archivePath build/wonni.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8 \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Export & upload to TestFlight
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          cd wonni
          xcodebuild -exportArchive \
            -archivePath build/wonni.xcarchive \
            -exportPath build \
            -exportOptionsPlist ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8 \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Upload archive as artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: wonni-xcarchive
          path: wonni/build/wonni.xcarchive
          retention-days: 7
