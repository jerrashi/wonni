name: SwiftLint

on:
  pull_request:
    paths: [wonni/wonni/**/*.swift]

# Least privilege: the default GITHUB_TOKEN can only read repo contents.
permissions:
  contents: read

jobs:
  swiftlint:
    name: SwiftLint
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v7

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint
        run: swiftlint --config wonni/.swiftlint.yml wonni/wonni/
