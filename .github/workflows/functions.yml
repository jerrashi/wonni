name: Functions CI/CD

on:
  push:
    branches: [main, backend-consolidation]
    paths: [functions/**]
  pull_request:
    branches: [main, backend-consolidation]
    paths: [functions/**]

# Least privilege: the default GITHUB_TOKEN can only read repo contents.
permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: functions

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - run: npm ci
      - run: npm run verify

  deploy:
    name: Deploy to Firebase
    needs: lint-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - run: npm ci
        working-directory: functions

      - run: npm install -g firebase-tools@15.28.2   # pinned: don't float to whatever 'latest' is on deploy day

      - name: Configure eBay function params
        # firebase deploy resolves defineString/defineSecret params from
        # functions/.env.<project-id> in non-interactive (CI) runs — it
        # won't fall back to an in-code default there. EBAY_RU_NAME has no
        # default (it's per-environment config, not a secret, but still not
        # committed) so it must come from a repo secret; add EBAY_RU_NAME
        # under Settings → Secrets and variables → Actions for this deploy
        # to succeed. EBAY_ENV defaults to production if unset.
        run: |
          {
            echo "EBAY_RU_NAME=${EBAY_RU_NAME}"
            echo "EBAY_ENV=${EBAY_ENV:-production}"
          } > functions/.env.wonni-app
        env:
          EBAY_RU_NAME: ${{ secrets.EBAY_RU_NAME }}
          EBAY_ENV: ${{ vars.EBAY_ENV }}

      - run: firebase deploy --only functions --project wonni-app
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
