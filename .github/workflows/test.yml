name: Test & Lint

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: the default GITHUB_TOKEN can only read repo contents.
permissions:
  contents: read

jobs:
  # Cheap gate so a docs-only PR doesn't pay for the ~15-20min macOS
  # build/test jobs below. Jobs stay in the graph (rather than using
  # `paths-ignore` on the workflow itself) and just report success-via-skip,
  # because a workflow that never runs at all leaves any branch-protection
  # required check with that job's name pending forever.
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code-changed: ${{ steps.check.outputs.code-changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for non-docs changes
        id: check
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
            HEAD_SHA="${{ github.sha }}"
          fi

          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "No comparable base commit — treating as code-changed."
            echo "code-changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          echo "Changed files:"
          echo "$CHANGED"

          if echo "$CHANGED" | grep -qvE '^(docs/|[^/]+\.md$)'; then
            echo "code-changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Only docs/**.md changed — skipping build/test jobs."
            echo "code-changed=false" >> "$GITHUB_OUTPUT"
          fi

  lint:
    name: SwiftLint
    runs-on: macos-latest
    timeout-minutes: 5
    needs: detect-changes
    if: needs.detect-changes.outputs.code-changed == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: SwiftLint
        run: |
          cd wonni
          if which swiftlint > /dev/null; then
            swiftlint --config .swiftlint.yml wonni/
          else
            echo "SwiftLint not installed, skipping"
          fi

  unit-tests:
    name: Unit Tests
    runs-on: macos-latest
    # Bumped from 15 (2026-09-25): two separate PR runs hit this ceiling under
    # heavier CI load with every visible test case still passing right up to
    # the cut — GitHub reports a timeout-kill as job conclusion "cancelled",
    # not "failure"/"timed_out", which reads like an infra flake until you
    # check the elapsed time against this limit. Not a test slowdown to chase;
    # just matching the headroom already given to ui-tests below.
    timeout-minutes: 25
    needs: detect-changes
    if: needs.detect-changes.outputs.code-changed == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Provide CI placeholder Secrets.xcconfig
        run: cp wonni/wonni/Secrets.xcconfig.example wonni/wonni/Secrets.xcconfig

      - name: Run unit tests
        run: |
          set -o pipefail
          cd wonni
          xcodebuild test \
            -scheme wonni \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest' \
            -configuration Debug \
            -enableCodeCoverage YES \
            2>&1 | tee test-output.log

      - name: Check test results
        if: failure()
        run: |
          echo "❌ Unit tests failed"
          tail -50 wonni/test-output.log
          exit 1

  ui-tests:
    name: UI Tests (Selling Flow)
    runs-on: macos-latest
    timeout-minutes: 25
    needs: detect-changes
    if: needs.detect-changes.outputs.code-changed == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Provide CI placeholder Secrets.xcconfig
        run: cp wonni/wonni/Secrets.xcconfig.example wonni/wonni/Secrets.xcconfig

      - name: Seed the simulator's Photos library
        # The UI tests drive selling through the gallery/photo picker (iOS
        # Simulator has no camera hardware for the AVCaptureSession shutter
        # path) — a fresh CI simulator's Photos library is empty, so without
        # this "At least one photo grid item should load" always times out.
        # `screencapture` was tried first but the macOS runner is headless
        # ("could not create image from display", found 2026-09-14) — build
        # the PNG by hand instead (stdlib zlib/struct only, no display or
        # extra tooling needed).
        run: |
          UDID=$(xcrun simctl list devices available --json | python3 -c '
          import json, re, sys
          devices = json.load(sys.stdin)["devices"]
          candidates = []
          for runtime, devs in devices.items():
              m = re.search(r"iOS-(\d+)-(\d+)", runtime)
              if not m:
                  continue
              version = tuple(int(x) for x in m.groups())
              for dev in devs:
                  if dev["name"] == "iPhone 17":
                      candidates.append((version, dev["udid"]))
          candidates.sort()
          # Highest iOS version wins, matching the test destinations OS=latest.
          print(candidates[-1][1])
          ')
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          python3 -c '
          import struct, zlib

          def chunk(tag, data):
              return struct.pack(">I", len(data)) + tag + data + struct.pack(">I", zlib.crc32(tag + data) & 0xffffffff)

          width, height = 200, 200
          ihdr = struct.pack(">IIBBBBB", width, height, 8, 2, 0, 0, 0)  # 8-bit RGB, no filter/interlace
          raw = b"".join(b"\x00" + bytes([80, 140, 200]) * width for _ in range(height))
          idat = zlib.compress(raw)
          png = b"\x89PNG\r\n\x1a\n" + chunk(b"IHDR", ihdr) + chunk(b"IDAT", idat) + chunk(b"IEND", b"")
          with open("/tmp/seed-photo.png", "wb") as f:
              f.write(png)
          '
          xcrun simctl addmedia "$UDID" /tmp/seed-photo.png
          # Pre-grant Photos access instead of relying on each UI test's
          # addUIInterruptionMonitor to catch and dismiss the system permission
          # alert. That interruption-monitor callback only fires on the test's
          # NEXT UI query/action after the alert appears — a race whichever
          # test happens to run first (testExecutionOrdering is "random" in
          # SellingFlow.xctestplan) can lose, since the alert can appear a beat
          # after the single flush tap. Granting it here, before the app ever
          # launches, removes that race outright.
          xcrun simctl privacy "$UDID" grant photos io.github.jerrashi.wonni
          # PhotoKit indexes a newly-added asset lazily, on first access by
          # whichever process queries it — which, without this step, is our
          # own app's picker mid-test. Launching Photos.app here instead makes
          # Apple's own (well-exercised) indexing path the first accessor,
          # ahead of the test, rather than racing it. This is in addition to,
          # not instead of, the flat wait below: launching Photos.app kicks
          # indexing off earlier, it doesn't prove indexing finished (still no
          # simctl subcommand for that — see prior note on this line). The
          # foreground dwell here was 5s initially; the very first test to
          # touch the picker in the next CI run still failed the 120s in-test
          # wait outright (2026-09-25, ~176s total including prior steps) —
          # 5s foreground time was apparently too short for Photos.app to
          # meaningfully start indexing before being killed. Bumped to 20s.
          xcrun simctl launch "$UDID" com.apple.mobileslideshow > /dev/null 2>&1 || true
          sleep 20
          xcrun simctl terminate "$UDID" com.apple.mobileslideshow > /dev/null 2>&1 || true
          # Give the simulator's photo indexing a head start here, in setup,
          # instead of paying that cold-start cost mid-test. Across the CI runs
          # that led to this fix, "At least one photo grid item should load"
          # (now a 120s wait, inside the test) passed cleanly 3 times in a row
          # and then timed out once more under heavier CI load — real
          # tail-latency variance, not a deterministic bug, so a blind timeout
          # bump alone would just be gambling on the next run's luck. There's
          # no simctl subcommand to positively confirm indexing is done, so
          # this is a flat wait, not a poll — but any time spent here is time
          # the actual test's own (already-generous) wait doesn't have to
          # cover. Bumped 15s -> 20s -> (unchanged here, see Photos.app dwell
          # bump above) across two consecutive CI failures on this same
          # assertion (2026-09-25) — still a mitigation, not a guarantee.
          sleep 20

      - name: Run selling flow UI tests
        run: |
          set -o pipefail
          cd wonni
          xcodebuild test \
            -scheme wonni \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest' \
            -configuration Debug \
            -testPlan SellingFlow \
            2>&1 | tee ui-test-output.log

      - name: Check UI test results
        if: failure()
        run: |
          echo "❌ UI tests failed - Selling flow is broken!"
          tail -100 wonni/ui-test-output.log
          exit 1

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-logs
          path: wonni/ui-test-output.log

  build:
    name: Build Check
    runs-on: macos-latest
    timeout-minutes: 15
    needs: detect-changes
    if: needs.detect-changes.outputs.code-changed == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Provide CI placeholder Secrets.xcconfig
        run: cp wonni/wonni/Secrets.xcconfig.example wonni/wonni/Secrets.xcconfig

      - name: Build app
        run: |
          cd wonni
          xcodebuild build \
            -scheme wonni \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug

      - name: Build test targets
        run: |
          cd wonni
          xcodebuild build-for-testing \
            -scheme wonni \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug

  test-results:
    name: Summary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [lint, unit-tests, ui-tests, build]
    if: always()
    steps:
      # Step-level success()/failure() only look at prior STEPS in this same
      # job — this job has none, so they don't actually see the needs jobs'
      # outcomes. That's why this used to print "All checks passed!" right
      # above a run that GitHub had already marked failed (found 2026-09-12).
      # Read needs.*.result explicitly instead.
      - name: ✅ All checks passed
        if: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
        run: echo "All tests and lint checks passed!"

      - name: ❌ Some checks failed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "⚠️  Build or tests failed. Review the logs above."
          exit 1

  # Fails the run if an obfuscated infostealer (or variant) is present in tracked
  # source — see scripts/check-no-obfuscated-code.js. Read-only; never executes repo code.
  malware-guard:
    name: Malware guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Scan for obfuscated / suspicious code
        run: node scripts/check-no-obfuscated-code.js
