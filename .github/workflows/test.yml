name: Test & Lint

# The ONE iOS gate. Branch protection on `main` requires the `Summary` job below,
# which fails if any of lint / unit tests / UI tests failed (skips count as pass,
# so a web-only or docs-only PR still merges).
#
# 2026-10-01 rework — why this looks the way it does:
#   * UI tests used to be opt-in via a `ui-tests` PR label that nobody ever added
#     (0 of the previous 15 merged PRs), so the carousel regression in #143 sailed
#     through with its own UI test sitting unrun. They now run on every PR that
#     touches iOS code. They are the slow job (~15 min) — that's the price.
#   * Branch protection required a check named "Lint & Test" that no job had been
#     called for months, so every PR showed BLOCKED and was merged with an admin
#     override. The required check is now `Summary`.
#   * The standalone swiftlint.yml always failed (548 pre-existing violations) and
#     the lint step here always skipped ("SwiftLint not installed"). Lint now runs
#     for real against a committed baseline (wonni/.swiftlint-baseline.json), so
#     only NEW violations fail. Regenerate the baseline after a deliberate cleanup:
#       cd wonni && swiftlint lint --write-baseline .swiftlint-baseline.json wonni/
#   * The separate "Build Check" job was dropped: `xcodebuild test` already builds
#     the app and test targets, so it was ~6 min of macOS runner buying nothing.

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: the default GITHUB_TOKEN can only read repo contents.
permissions:
  contents: read

env:
  # Pin so CI's violations line up with the committed baseline (generated locally
  # with the same version).
  SWIFTLINT_VERSION: 0.65.1
  SIMULATOR: platform=iOS Simulator,name=iPhone 17,OS=latest

jobs:
  # Cheap gate so web/functions/docs-only PRs don't pay for macOS runners. Jobs
  # stay in the graph and report success-via-skip rather than using
  # `paths-ignore` on the workflow, because a workflow that never runs leaves a
  # required check pending forever.
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ios-changed: ${{ steps.check.outputs.ios-changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for iOS changes
        id: check
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
            HEAD_SHA="${{ github.sha }}"
          fi

          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BASE_SHA" 2>/dev/null; then
            echo "No comparable base commit — treating as iOS-changed."
            echo "ios-changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          echo "Changed files:"
          echo "$CHANGED"

          # The iOS project, or this workflow itself.
          if echo "$CHANGED" | grep -qE '^(wonni/|\.github/workflows/test\.yml)'; then
            echo "ios-changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No iOS changes — skipping macOS jobs."
            echo "ios-changed=false" >> "$GITHUB_OUTPUT"
          fi

  lint:
    name: SwiftLint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: detect-changes
    if: needs.detect-changes.outputs.ios-changed == 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Install SwiftLint
        run: |
          # --fail so a bad URL is a loud 404, not a quietly saved HTML page.
          curl -sSL --fail -o swiftlint.zip \
            "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/swiftlint_linux_amd64.zip"
          # The zip ships `swiftlint` (dynamic, needs no extra libs on ubuntu-latest)
          # and `swiftlint-static`; we only need the static one.
          unzip -q swiftlint.zip swiftlint-static -d swiftlint-bin
          mv swiftlint-bin/swiftlint-static swiftlint-bin/swiftlint
          chmod +x swiftlint-bin/swiftlint
          echo "$PWD/swiftlint-bin" >> "$GITHUB_PATH"

      - name: SwiftLint (new violations only)
        working-directory: wonni
        run: |
          swiftlint version
          # --strict: warnings fail too. --baseline: the 548 pre-existing violations
          # are ignored; anything not in the baseline is new and fails the job.
          swiftlint lint --strict --reporter github-actions-logging \
            --config .swiftlint.yml --baseline .swiftlint-baseline.json wonni/

  unit-tests:
    name: Unit Tests
    runs-on: macos-latest
    # 25, not 15: two PR runs hit the lower ceiling under heavy CI load with every
    # test passing — a timeout-kill reports as "cancelled", which reads like a flake.
    timeout-minutes: 25
    needs: detect-changes
    if: needs.detect-changes.outputs.ios-changed == 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Provide CI placeholder Secrets.xcconfig
        run: cp wonni/wonni/Secrets.xcconfig.example wonni/wonni/Secrets.xcconfig

      - name: Run unit tests
        working-directory: wonni
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme wonni \
            -destination "$SIMULATOR" \
            -configuration Debug \
            -testPlan UnitTests \
            -resultBundlePath UnitTests.xcresult \
            2>&1 | tee test-output.log

      - name: Show failures
        if: failure()
        run: grep -E "error:|failed \(" wonni/test-output.log | sed 's#.*/wonni/##' | sort -u | head -60

      - name: Upload result bundle
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-tests-xcresult
          path: wonni/UnitTests.xcresult

  # Runs on every iOS PR (no more opt-in label). This is the only job that exercises
  # the real screens end to end — it's what would have caught #143 on day one.
  ui-tests:
    name: UI Tests (Selling Flow)
    runs-on: macos-latest
    timeout-minutes: 30
    needs: detect-changes
    if: needs.detect-changes.outputs.ios-changed == 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Provide CI placeholder Secrets.xcconfig
        run: cp wonni/wonni/Secrets.xcconfig.example wonni/wonni/Secrets.xcconfig

      - name: Seed the simulator's Photos library
        # The UI tests drive selling through the photo picker (the Simulator has no
        # camera). A fresh CI simulator's Photos library is empty, so without this
        # "At least one photo grid item should load" always times out. The PNG is
        # built by hand — the macOS runner is headless, so `screencapture` fails.
        run: |
          UDID=$(xcrun simctl list devices available --json | python3 -c '
          import json, re, sys
          devices = json.load(sys.stdin)["devices"]
          candidates = []
          for runtime, devs in devices.items():
              m = re.search(r"iOS-(\d+)-(\d+)", runtime)
              if not m:
                  continue
              version = tuple(int(x) for x in m.groups())
              for dev in devs:
                  if dev["name"] == "iPhone 17":
                      candidates.append((version, dev["udid"]))
          candidates.sort()
          # Highest iOS version wins, matching the test destination OS=latest.
          print(candidates[-1][1])
          ')
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          python3 -c '
          import struct, zlib

          def chunk(tag, data):
              return struct.pack(">I", len(data)) + tag + data + struct.pack(">I", zlib.crc32(tag + data) & 0xffffffff)

          width, height = 200, 200
          ihdr = struct.pack(">IIBBBBB", width, height, 8, 2, 0, 0, 0)  # 8-bit RGB, no filter/interlace
          raw = b"".join(b"\x00" + bytes([80, 140, 200]) * width for _ in range(height))
          idat = zlib.compress(raw)
          png = b"\x89PNG\r\n\x1a\n" + chunk(b"IHDR", ihdr) + chunk(b"IDAT", idat) + chunk(b"IEND", b"")
          with open("/tmp/seed-photo.png", "wb") as f:
              f.write(png)
          '
          xcrun simctl addmedia "$UDID" /tmp/seed-photo.png
          # Pre-grant Photos access so no test races the system permission alert
          # (addUIInterruptionMonitor only fires on the NEXT UI query after the alert).
          xcrun simctl privacy "$UDID" grant photos io.github.jerrashi.wonni
          # PhotoKit indexes a new asset lazily on first access. Make Photos.app the
          # first accessor (20s foreground dwell — 5s was too short, 2026-09-25) and
          # then give indexing a flat head start. No simctl call confirms indexing
          # finished, so this is mitigation, not a guarantee.
          xcrun simctl launch "$UDID" com.apple.mobileslideshow > /dev/null 2>&1 || true
          sleep 20
          xcrun simctl terminate "$UDID" com.apple.mobileslideshow > /dev/null 2>&1 || true
          sleep 20

      - name: Run selling flow UI tests
        working-directory: wonni
        run: |
          set -o pipefail
          # -retry-tests-on-failure: one automatic retry absorbs simulator flakes
          # (Photos indexing tail latency) without hiding a real failure — a
          # genuinely broken screen fails both attempts.
          xcodebuild test \
            -scheme wonni \
            -destination "$SIMULATOR" \
            -configuration Debug \
            -testPlan SellingFlow \
            -retry-tests-on-failure \
            -test-iterations 2 \
            -resultBundlePath SellingFlow.xcresult \
            2>&1 | tee ui-test-output.log

      - name: Show failures
        if: failure()
        run: grep -E "error:|failed \(" wonni/ui-test-output.log | sed 's#.*/wonni/##' | sort -u | head -60

      - name: Upload result bundle (screenshots of every failure)
        # Open SellingFlow.xcresult in Xcode: each failed step has an automatic
        # screenshot + the accessibility hierarchy at the moment it failed.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-tests-xcresult
          path: |
            wonni/SellingFlow.xcresult
            wonni/ui-test-output.log

  # THE required check (branch protection on main). Reads needs.*.result
  # explicitly — step-level success()/failure() only see prior steps in this
  # job, which is how this once printed "All checks passed!" above a red run.
  test-results:
    name: Summary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [lint, unit-tests, ui-tests, malware-guard]
    if: always()
    steps:
      - name: Report
        run: |
          echo "lint:       ${{ needs.lint.result }}"
          echo "unit-tests: ${{ needs.unit-tests.result }}"
          echo "ui-tests:   ${{ needs.ui-tests.result }}"
          echo "malware:    ${{ needs.malware-guard.result }}"
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "::error::One or more iOS checks failed. See the job logs and the uploaded .xcresult bundles."
            exit 1
          fi
          echo "All iOS checks passed (or were skipped because no iOS code changed)."

  # Fails the run if an obfuscated infostealer (or variant) is present in tracked
  # source — see scripts/check-no-obfuscated-code.js. Read-only; never executes repo code.
  malware-guard:
    name: Malware guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Scan for obfuscated / suspicious code
        run: node scripts/check-no-obfuscated-code.js
