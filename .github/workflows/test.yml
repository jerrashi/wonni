name: Test & Lint

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  lint:
    name: SwiftLint
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: SwiftLint
        run: |
          cd wonni
          if which swiftlint > /dev/null; then
            swiftlint
          else
            echo "SwiftLint not installed, skipping"
          fi

  unit-tests:
    name: Unit Tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Provide CI placeholder Secrets.xcconfig
        run: cp wonni/wonni/Secrets.xcconfig.example wonni/wonni/Secrets.xcconfig

      - name: Run unit tests
        run: |
          set -o pipefail
          cd wonni
          xcodebuild test \
            -scheme wonni \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest' \
            -configuration Debug \
            -enableCodeCoverage YES \
            2>&1 | tee test-output.log

      - name: Check test results
        if: failure()
        run: |
          echo "❌ Unit tests failed"
          tail -50 wonni/test-output.log
          exit 1

  ui-tests:
    name: UI Tests (Selling Flow)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Provide CI placeholder Secrets.xcconfig
        run: cp wonni/wonni/Secrets.xcconfig.example wonni/wonni/Secrets.xcconfig

      - name: Run selling flow UI tests
        run: |
          set -o pipefail
          cd wonni
          xcodebuild test \
            -scheme wonni \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest' \
            -configuration Debug \
            -testPlan SellingFlow \
            2>&1 | tee ui-test-output.log

      - name: Check UI test results
        if: failure()
        run: |
          echo "❌ UI tests failed - Selling flow is broken!"
          tail -100 wonni/ui-test-output.log
          exit 1

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-logs
          path: wonni/ui-test-output.log

  build:
    name: Build Check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Provide CI placeholder Secrets.xcconfig
        run: cp wonni/wonni/Secrets.xcconfig.example wonni/wonni/Secrets.xcconfig

      - name: Build app
        run: |
          cd wonni
          xcodebuild build \
            -scheme wonni \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug

      - name: Build test targets
        run: |
          cd wonni
          xcodebuild build-for-testing \
            -scheme wonni \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug

  test-results:
    name: Summary
    runs-on: ubuntu-latest
    needs: [lint, unit-tests, ui-tests, build]
    if: always()
    steps:
      # Step-level success()/failure() only look at prior STEPS in this same
      # job — this job has none, so they don't actually see the needs jobs'
      # outcomes. That's why this used to print "All checks passed!" right
      # above a run that GitHub had already marked failed (found 2026-09-12).
      # Read needs.*.result explicitly instead.
      - name: ✅ All checks passed
        if: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
        run: echo "All tests and lint checks passed!"

      - name: ❌ Some checks failed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "⚠️  Build or tests failed. Review the logs above."
          exit 1
