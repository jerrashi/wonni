<!doctype html>
<html>
<head>
  <meta charset="UTF-8" />
  <style>
    body {
      width: 280px;
      min-height: 160px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f0f0f;
      color: #f0f0f0;
      margin: 0;
      padding: 16px;
    }
    .logo { font-size: 16px; font-weight: 700; color: #ff6b35; margin-bottom: 12px; }
    .status { font-size: 13px; color: #888; margin-bottom: 16px; }
    .status strong { color: #f0f0f0; }
    button {
      display: block;
      width: 100%;
      padding: 10px;
      margin-bottom: 8px;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 6px;
      color: #f0f0f0;
      font-size: 13px;
      cursor: pointer;
      text-align: left;
      transition: background 0.15s;
    }
    button:hover { background: #2a2a2a; }
    .btn-primary { background: #ff6b35 !important; border-color: #ff6b35; font-weight: 600; }
    .btn-primary:hover { background: #ff8555 !important; }
    .recent { margin-top: 12px; border-top: 1px solid #2a2a2a; padding-top: 12px; }
    .recent-title { font-size: 11px; color: #555; text-transform: uppercase; margin-bottom: 8px; }
    .recent-item { font-size: 12px; color: #888; padding: 4px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .field { margin: 12px 0; }
    .field label { display: block; font-size: 11px; color: #555; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.04em; }
    .field input {
      width: 100%;
      padding: 8px 10px;
      background: #0f0f0f;
      border: 1px solid #2a2a2a;
      border-radius: 6px;
      color: #f0f0f0;
      font-size: 12px;
      box-sizing: border-box;
    }
    .field button { margin-top: 8px; }
  </style>
</head>
<body>
  <div class="logo">Wonni Drop</div>
  <div class="status" id="status">Loading…</div>
  <button class="btn-primary" onclick="openDashboard()">Open Dashboard</button>
  <button id="auth-btn"></button>
  <div class="field">
    <label for="dashboard-url">Dashboard URL</label>
    <input id="dashboard-url" type="text" placeholder="http://localhost:5173" />
    <button id="save-dashboard-btn">Save Dashboard URL</button>
  </div>
  <div class="recent" id="recent-section" style="display:none">
    <div class="recent-title">Recently Imported</div>
    <div id="recent-list"></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
